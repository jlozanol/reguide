[project]
name = "reguide"
version = "0.1.0"
description = "TGA classification and reimbursement triage for early-stage medical devices"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Profile schema and validation
    "pydantic>=2.9",
    # Intake and report assembly, the only two model calls in the pipeline
    "anthropic>=0.40",
    # openFDA requests
    "httpx>=0.27",
    # Reads .env so keys never sit in the code
    "python-dotenv>=1.0",
]

[project.optional-dependencies]

# Rebuilding the local data copies. Not needed to run the pipeline.
data = [
    "pandas>=2.2",        # ARTG and MBS exports
    "openpyxl>=3.1",      # the TGA export is xlsx
    "pypdf>=5.0",         # MSAC public summary documents are PDFs
    "rapidfuzz>=3.10",    # matching intended purpose against listings
]

# Streamlit demo layer
app = [
    "streamlit>=1.40",
]

dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reguide"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]